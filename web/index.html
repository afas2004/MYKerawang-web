<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#5B3E96">
  <meta name="description" content="MYKerawang — community marketplace and events platform.">

  <!-- Link previews (WhatsApp, Telegram, X…). Crawlers don't run Flutter,
       so every shared URL gets this same generic card; per-item previews
       would need server-side rendering (e.g. a Cloud Function on /event/**).
       og:image must be an absolute URL. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MYKerawang">
  <meta property="og:title" content="MYKerawang">
  <meta property="og:description" content="Events, marketplace and community posts for the UiTM Kerawang college community.">
  <meta property="og:image" content="https://mykerawang-app.web.app/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="MYKerawang logo">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="MYKerawang">
  <meta name="twitter:description" content="Events, marketplace and community posts for the UiTM Kerawang college community.">
  <meta name="twitter:image" content="https://mykerawang-app.web.app/icons/Icon-512.png">

  <!-- Open connections early: engine (skwasm/canvaskit), fonts, backend -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://zxjuqpqzyzmegdjttzyz.supabase.co" crossorigin>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MYKerawang">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MYKerawang</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash: shown while the engine + app download (several seconds on
       mobile data), removed on Flutter's first frame. -->
  <style>
    html, body { margin: 0; height: 100%; background: #5B3E96; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      background: #5B3E96; transition: opacity .25s ease;
    }
    #splash img { width: 96px; height: 96px; border-radius: 50%; background: #fff; }
    #splash .bar {
      width: 120px; height: 3px; border-radius: 2px; overflow: hidden;
      background: rgba(255,255,255,.25);
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #fff; animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading MYKerawang">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
