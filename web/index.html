<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#F6F5F8">
  <meta name="description" content="MYKerawang — community marketplace and events platform.">

  <!-- Link previews (WhatsApp, Telegram, X…). Crawlers don't run Flutter,
       so every shared URL gets this same generic card; per-item previews
       would need server-side rendering (e.g. a Cloud Function on /event/**).
       og:image must be an absolute URL. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MYKerawang">
  <meta property="og:title" content="MYKerawang">
  <meta property="og:description" content="Events, marketplace and community posts for the UiTM Kerawang college community.">
  <meta property="og:image" content="https://kerawang.my/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="MYKerawang logo">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="MYKerawang">
  <meta name="twitter:description" content="Events, marketplace and community posts for the UiTM Kerawang college community.">
  <meta name="twitter:image" content="https://kerawang.my/icons/Icon-512.png">

  <!-- Open connections early: engine (skwasm/canvaskit), fonts, backend -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://zxjuqpqzyzmegdjttzyz.supabase.co" crossorigin>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MYKerawang">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MYKerawang</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash: shown while the engine + app download (several seconds on
       mobile data), removed on Flutter's first frame. Background follows the
       saved theme (same values as lib/theme/app_themes.dart) so there's no
       flash when Flutter paints: plain background, the K tile, and a songket
       hem that weaves across while loading (static under reduced motion). -->
  <style>
    :root { --bg: #F6F5F8; --primary: #5E1A4F; --track: rgba(94,26,79,.14); }
    html[data-theme="istana"] { --bg: #F7F3EE; --primary: #55163F; --track: rgba(85,22,63,.14); }
    html[data-theme="noir"]   { --bg: #130C11; --primary: #D9A0C8; --track: rgba(217,160,200,.18); }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      background: var(--bg); transition: opacity .2s ease;
    }
    #splash img { width: 88px; height: 88px; border-radius: 22px; background: #fff;
      box-shadow: 0 1px 0 var(--track); animation: settle .5s cubic-bezier(.2,.8,.2,1) both; }
    #splash .hem { width: 132px; height: 10px; background: var(--track); position: relative; overflow: hidden;
      -webkit-mask: url("assets/assets/brand/songket_perseri.svg") left center / auto 100% repeat-x;
      mask: url("assets/assets/brand/songket_perseri.svg") left center / auto 100% repeat-x; }
    #splash .hem::after { content: ""; position: absolute; inset: 0; background: var(--primary);
      transform-origin: left; animation: weave 1.4s cubic-bezier(.6,0,.2,1) infinite; }
    @keyframes settle { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes weave { 0% { transform: scaleX(0); } 60%, 100% { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      #splash img, #splash .hem::after { animation: none; }
    }
  </style>
  <script>
    // Match the saved theme before first paint (shared_preferences on web
    // stores "flutter.appTheme" as a JSON string). Default: Kampus Bold.
    (function () {
      var t = 'kampus';
      try { t = JSON.parse(localStorage.getItem('flutter.appTheme')) || t; } catch (e) {}
      if (t !== 'istana' && t !== 'noir') t = 'kampus';
      document.documentElement.setAttribute('data-theme', t);
      var c = { kampus: '#F6F5F8', istana: '#F7F3EE', noir: '#130C11' }[t];
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', c);
    })();
  </script>
</head>
<body>
  <div id="splash" role="progressbar" aria-label="Loading MYKerawang">
    <img src="icons/Icon-192.png" alt="">
    <div class="hem"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script>
    // Last-resort recovery from a lost GPU context ("white screen on
    // return"). Android Chrome reclaims a background tab's WebGL context —
    // typically while the camera / photo picker is open. CanvasKit (used on
    // Android, see flutter_bootstrap.js) rebuilds itself when the context
    // is restored; if it never is, or the renderer can't recover (skwasm),
    // reload once. Create forms autosave their text, so a reload there
    // doesn't lose the typing. Rate-limited so it can never loop.
    (function () {
      var lost = false;
      function recover() {
        try {
          var last = +sessionStorage.getItem('mk.recoveredAt') || 0;
          if (Date.now() - last < 20000) return;
          sessionStorage.setItem('mk.recoveredAt', String(Date.now()));
        } catch (e) {}
        location.reload();
      }
      function checkSoon() {
        // Give the renderer a moment to get its context back first.
        setTimeout(function () {
          if (lost && document.visibilityState === 'visible') recover();
        }, 2000);
      }
      // Each real render surface is tracked on its own: the page counts as
      // broken while any of them is lost and not yet restored.
      var lostCanvases = typeof Set === 'function' ? new Set() : null;
      function onLost(e) {
        if (!lostCanvases) return;
        lostCanvases.add(e.target);
        lost = true;
        if (document.visibilityState === 'visible') checkSoon();
      }
      function onRestored(e) {
        // Only CanvasKit redraws after a restore; skwasm stays blank.
        if (!lostCanvases || window.__mkRenderer !== 'canvaskit') return;
        lostCanvases.delete(e.target);
        lost = lostCanvases.size > 0;
      }
      // CanvasKit draws through an OffscreenCanvas that is never in the
      // DOM, so its events can't be heard on window. Instead every WebGL
      // context, on- or off-screen, reports here as it is created — except
      // the engine's 1x1 capability probe, which nobody ever restores.
      var watched = typeof WeakSet === 'function' ? new WeakSet() : null;
      function watch(proto) {
        if (!proto || !proto.getContext || !watched) return;
        var original = proto.getContext;
        proto.getContext = function (type) {
          var ctx = original.apply(this, arguments);
          if (ctx && /^(webgl|experimental-webgl)/.test(String(type)) &&
              this.width * this.height > 1 && !watched.has(this)) {
            watched.add(this);
            this.addEventListener('webglcontextlost', onLost);
            this.addEventListener('webglcontextrestored', onRestored);
          }
          return ctx;
        };
      }
      watch(window.HTMLCanvasElement && HTMLCanvasElement.prototype);
      watch(window.OffscreenCanvas && OffscreenCanvas.prototype);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && lost) checkSoon();
      });
      // Back/forward cache restore with a dead context.
      window.addEventListener('pageshow', function (e) {
        if (e.persisted && lost) checkSoon();
      });
    })();
  </script>
  <script>{{flutter_bootstrap_js}}</script>
</body>
</html>
