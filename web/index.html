<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#F6F6F9">
  <meta name="description" content="MYKerawang — community marketplace and events platform.">

  <!-- Link previews (WhatsApp, Telegram, X…). Crawlers don't run Flutter,
       so every shared URL gets this same generic card; per-item previews
       would need server-side rendering (e.g. a Cloud Function on /event/**).
       og:image must be an absolute URL. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MYKerawang">
  <meta property="og:title" content="MYKerawang">
  <meta property="og:description" content="Events, marketplace and community posts for the UiTM Kerawang college community.">
  <meta property="og:image" content="https://mykerawang-app.web.app/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="MYKerawang logo">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="MYKerawang">
  <meta name="twitter:description" content="Events, marketplace and community posts for the UiTM Kerawang college community.">
  <meta name="twitter:image" content="https://mykerawang-app.web.app/icons/Icon-512.png">

  <!-- Open connections early: engine (skwasm/canvaskit), fonts, backend -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://zxjuqpqzyzmegdjttzyz.supabase.co" crossorigin>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MYKerawang">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MYKerawang</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash: shown while the engine + app download (several seconds on
       mobile data), removed on Flutter's first frame. Background follows the
       saved theme (same values as lib/theme/app_themes.dart) so there's no
       flash when Flutter paints: plain background, logo, small spinner. -->
  <style>
    :root { --bg: #F6F6F9; --primary: #5B3E96; --track: rgba(91,62,150,.15); }
    html[data-theme="istana"] { --bg: #F7F4EE; --primary: #4E3680; --track: rgba(78,54,128,.15); }
    html[data-theme="noir"]   { --bg: #0F0E13; --primary: #A48BEA; --track: rgba(164,139,234,.18); }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      background: var(--bg); transition: opacity .2s ease;
    }
    #splash img { width: 88px; height: 88px; border-radius: 50%; background: #fff; }
    #splash .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2.5px solid var(--track); border-top-color: var(--primary);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .spinner { animation: none; border-color: var(--track); }
    }
  </style>
  <script>
    // Match the saved theme before first paint (shared_preferences on web
    // stores "flutter.appTheme" as a JSON string). Default: Kampus Bold.
    (function () {
      var t = 'kampus';
      try { t = JSON.parse(localStorage.getItem('flutter.appTheme')) || t; } catch (e) {}
      if (t !== 'istana' && t !== 'noir') t = 'kampus';
      document.documentElement.setAttribute('data-theme', t);
      var c = { kampus: '#F6F6F9', istana: '#F7F4EE', noir: '#0F0E13' }[t];
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', c);
    })();
  </script>
</head>
<body>
  <div id="splash" role="progressbar" aria-label="Loading MYKerawang">
    <img src="icons/Icon-192.png" alt="">
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script>{{flutter_bootstrap_js}}</script>
</body>
</html>
